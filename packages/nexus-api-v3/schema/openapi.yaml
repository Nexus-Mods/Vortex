        "404":
          description: The mod was not found.
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/ProblemDetails"
  "/mods/{id}/changelogs":
    post:
      tags:
        - mods
      x-badges:
        - name: Experimental
          color: orange
      summary: Add changelog entries for a mod version
      description: |
        Appends changelog text for a version of a mod.

        This is additive only: repeated calls for the same version append further text rather
        than replacing what's already there.
      operationId: addModChangelogEntries
      parameters:
        - name: id
          in: path
          required: true
          description: The unique identifier for the mod.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/AddModChangelogEntriesRequest"
      responses:
        "201":
          description: The created changelog entries.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    "$ref": "#/components/schemas/AddModChangelogEntriesSuccess"
        "403":
          description: Forbidden
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/ProblemDetails"
        "404":
          description: The mod was not found.
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/ProblemDetails"
        "422":
          description: The request body failed validation.
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/ProblemDetails"
  "/mods/{id}/toggle-legacy-mod-requirements":
    put:
      tags:
        - mods
      summary: Toggle legacy mod requirements for a mod
      description: |
        Sets whether the given mod should use the legacy mod-level requirements.
        When `enabled` is `true`, the mod uses legacy mod-level requirements; when
        `false`, it uses file-to-file requirements.
      operationId: toggleLegacyModRequirements
      x-badges:
        - name: Experimental
          color: orange
      parameters:
        - name: id
          in: path
          required: true
          description: The unique identifier for the mod.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ToggleLegacyModRequirementsRequest"
      responses:
        "204":
          description: Successfully updated the mod's legacy mod requirements enabled
            state.
        "403":
          description: Forbidden
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/ProblemDetails"
        "404":
          description: The mod was not found.
          content:
            application/problem+json:
              schema:
