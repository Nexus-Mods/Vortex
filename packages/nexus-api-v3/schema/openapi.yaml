              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    "$ref": "#/components/schemas/ModFileWithAggregates"
        "403":
          description: Forbidden
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/ProblemDetails"
        "404":
          description: The mod file was not found.
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/ProblemDetails"
    put:
      tags:
        - mods
      summary: Update a mod file
      description: Updates the name of an existing mod file by its ID.
      operationId: updateModFile
      x-badges:
        - name: Experimental
          color: orange
      parameters:
        - name: id
          in: path
          required: true
          description: The unique identifier of the mod file to update.
          schema:
            type: string
      requestBody:
        description: The new data for the mod file.
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/UpdateModFileRequest"
      responses:
        "204":
          description: Successfully updated the mod file.
        "403":
          description: Forbidden
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/ProblemDetails"
        "404":
          description: The mod file was not found.
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/ProblemDetails"
        "422":
          description: The request body failed validation.
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/ProblemDetails"
  "/mod-file-versions/{id}/dependencies":
    get:
      tags:
        - mods
      summary: Get mod file version dependencies
      description: |
        Retrieve the **raw** dependencies for a given mod file version with both the
        version-range dependencies and the DLC dependencies, returned exactly as
        authored and stored.

        The version ranges here are **not** resolved into the concrete candidate
        mod file versions that currently satisfy them. To get resolved candidates
        grouped by mod file, use the materialized endpoint.
      operationId: getModFileVersionDependencies
      x-badges:
        - name: Experimental
          color: orange
      parameters:
        - name: id
          in: path
          required: true
          description: The unique identifier for the mod file version.
          schema:
            type: string
      responses:
        "200":
          description: The mod file version's dependencies.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ModFileVersionDependenciesResponse"
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/ProblemDetails"
        "403":
          description: Forbidden
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/ProblemDetails"
        "404":
          description: The mod file version was not found.
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/ProblemDetails"
  "/mod-file-versions/{id}/dependencies/ranges":
    get:
      tags:
        - mods
      summary: Get mod file version dependency ranges
      description: |
        Retrieve dependency ranges for a given mod file version. Each dependency definition
        contains a set of version ranges within mod files that satisfy the dependency.
      operationId: getModFileVersionDependencyRanges
      x-badges:
        - name: Experimental
          color: orange
      parameters:
        - name: id
          in: path
          required: true
          description: The unique identifier for the mod file version.
          schema:
            type: string
      responses:
        "200":
          description: The mod file version's dependency ranges.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ModFileVersionDependencyRangesResponse"
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/ProblemDetails"
        "403":
          description: Forbidden
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/ProblemDetails"
        "404":
          description: The mod file version was not found.
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/ProblemDetails"
    put:
      tags:
        - mods
      summary: Update mod file version dependency ranges
      description: |
        Replace all dependency range definitions for a given mod file version. Each
        dependency definition contains an array of version ranges. Ranges
        within the same definition represent alternatives (OR). Separate
        definitions are independent requirements (AND).

        A range is defined by a min_version_id (required) and an optional
        max_version_id. Both must refer to versions within the same mod file.
        When max_version_id is null the range is open-ended (no upper bound).
      operationId: setModFileVersionDependencyRanges
      x-badges:
        - name: Experimental
          color: orange
      parameters:
        - name: id
          in: path
          required: true
          description: The unique identifier for the mod file version (i.e. the version
            to create dependency ranges for).
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/UpdateModFileVersionDependencyRangesRequest"
      responses:
        "204":
          description: Successfully updated the mod file version dependency ranges.
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/ProblemDetails"
        "403":
          description: Forbidden
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/ProblemDetails"
        "404":
          description: The mod file version was not found.
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/ProblemDetails"
        "422":
          description: The request body failed validation.
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/ProblemDetails"
  "/mod-file-versions/{id}/dependencies/dlc":
    get:
      tags:
        - mods
      summary: Get mod file version DLC dependencies
      description: Retrieve the DLC dependencies for a given mod file version.
      operationId: getModFileVersionDlcDependencies
      x-badges:
        - name: Experimental
          color: orange
      parameters:
        - name: id
          in: path
          required: true
          description: The unique identifier for the mod file version.
          schema:
            type: string
      responses:
        "200":
          description: The mod file version's DLC dependencies.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ModFileVersionDlcDependenciesResponse"
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/ProblemDetails"
        "403":
          description: Forbidden
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/ProblemDetails"
        "404":
          description: The mod file version was not found.
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/ProblemDetails"
    put:
      tags:
        - mods
      summary: Update mod file version DLC dependencies
      description: |
        Replace all DLC dependency definitions for a given mod file version. Each
        definition contains an array of DLC ids. DLCs within the same definition
        represent alternatives (OR). Separate definitions are independent
        requirements (AND).

        Each DLC id must reference a DLC available for the mod file version's game,
        as listed by the game DLCs endpoint. Sending an empty array of definitions
        removes all DLC dependencies from the version.
      operationId: setModFileVersionDependencyDlc
      x-badges:
        - name: Experimental
          color: orange
      parameters:
        - name: id
          in: path
          required: true
          description: The unique identifier for the mod file version (i.e. the version
            to set DLC dependencies for).
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/UpdateModFileVersionDlcDependenciesRequest"
      responses:
        "204":
          description: Successfully updated the mod file version DLC dependencies.
        "403":
          description: Forbidden
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/ProblemDetails"
        "404":
          description: The mod file version was not found.
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/ProblemDetails"
        "422":
          description: The request body failed validation.
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/ProblemDetails"
  "/mod-file-versions/{id}/dependencies/ranges/materialized":
    get:
      tags:
        - mods
      summary: Get a mod file versions materialized version-range dependencies
      description: |
        Retrieve materialized dependencies for a given mod file version. Resolves the
        stored dependency ranges into concrete candidate versions grouped by mod file.
      operationId: getModFileVersionDependencyRangesMaterialized
      x-badges:
        - name: Experimental
          color: orange
      parameters:
        - name: id
          in: path
          required: true
          description: The unique identifier for the mod file version.
          schema:
            type: string
      responses:
        "200":
          description: The mod file version's materialized version-range dependencies.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ModFileVersionDependencyRangesMaterializedResponse"
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/ProblemDetails"
        "403":
          description: Forbidden
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/ProblemDetails"
        "404":
          description: The mod file version was not found.
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/ProblemDetails"
  "/mod-file-versions/dependencies/materialized/batch":
    post:
      tags:
        - mods
      summary: Batch get mod file version materialized dependency candidates
      description: |
        Resolves the materialized dependency candidates for a set of source mod file versions —
        the versions a client could install or recommend to satisfy each source version's
        dependencies.

        Each row is one candidate version for one source version's dependency definition. Rows
        sharing a `definition_id` are OR-alternatives (any one satisfies that dependency); rows
        sharing a `mod_file_id` are versions of the same mod file (update group/chain). Only
        candidates on published, non-moderated mods are included.

        Results are paged with a stable order, so the full candidate set can be fetched across
        pages. Source version ids with no resolvable candidates contribute no rows.

        `meta.total_count` is only meaningful on a non-empty page; a page past the end returns no
        candidates and `total_count` 0.
      operationId: getModFileVersionDependencyCandidatesBatch
      deprecated: true
      x-badges:
        - name: Deprecated
          color: red
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ModFileVersionDependencyCandidatesBatchRequest"
      responses:
        "200":
          description: A page of materialized dependency candidate rows.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    "$ref": "#/components/schemas/ModFileVersionDependencyCandidatesBatchResponse"
                  meta:
                    "$ref": "#/components/schemas/PaginationMeta"
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/ProblemDetails"
        "422":
          description: The request body failed validation.
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/ProblemDetails"
  "/mod-file-versions/dependencies/ranges/materialized/batch":
    post:
      tags:
        - mods
      summary: Batch get mod file version materialized dependency candidates
      description: |
        Resolves the materialized dependency candidates for a set of source mod file versions —
        the versions a client could install or recommend to satisfy each source version's
        dependencies.

        Each row is one candidate version for one source version's dependency definition. Rows
        sharing a `definition_id` are OR-alternatives (any one satisfies that dependency); rows
        sharing a `mod_file_id` are versions of the same mod file (update group/chain). Only
        candidates on published, non-moderated mods are included.

        Results are paged with a stable order, so the full candidate set can be fetched across
        pages. Source version ids with no resolvable candidates contribute no rows.

        `meta.total_count` is only meaningful on a non-empty page; a page past the end returns no
        candidates and `total_count` 0.
      operationId: getModFileVersionDependencyRangesMaterializedBatch
