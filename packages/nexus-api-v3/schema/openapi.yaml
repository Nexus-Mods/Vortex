---
openapi: 3.0.3
info:
  title: Nexus Mods API
  version: 3.0.0
  description: "## Overview\nBuild tools and integrations for the Nexus Mods platform
    using our API.\n\n* Access mod data, user information, and platform features to
    power your own applications, services, and workflows.\n* Use our OpenAPI specification
    to explore and integrate the API.\n\n### I want to\n#### upload a mod\n* **Using
    GitHub to manage your mod workflow?** Try our [GitHub action](https://github.com/marketplace/actions/upload-to-nexus-mods)\n
    \ and [sample workflow](https://github.com/Nexus-Mods/API-Example)!\n* Or get
    started at [creating a new upload session](#tag/uploads/operation/createUpload).\n\n###
    Legacy APIs    \nLegacy integrations may still be using our [v1 API](https://app.swaggerhub.com/apis-docs/NexusMods/nexus-mods_public_api_params_in_form_data/1.0#/).\n\n###
    API Stability\n\nEndpoints are marked with badges indicating their stability level:\n\n|
    Badge | Meaning |\n| ----- | ------- |\n| *(none)* | **Stable** - Production ready.
    No breaking changes. |\n| Beta | Feature complete but may have minor changes before
    stabilisation. |\n| Experimental | May change significantly or be removed. Not
    recommended for production. |\n\nStable endpoints may receive additive enhancements
    (new optional fields/parameters)\nthat won't break existing integrations.\n\n###
    Deprecation Policy\n\n**Stable endpoints:** If a field or endpoint needs to change,
    it will be marked as\n`deprecated` with a minimum **90-day deprecation period**
    and migration guidance.\n\n**Beta endpoints:** Changes will be marked as `deprecated`
    with a minimum **10-day\ndeprecation period** and migration guidance.\n\nDeprecated
    fields continue to function during the deprecation period.\n\n### Upcoming Changes\n\n|
    Date | Change |\n| ---- | ------ |\n| 2026-12-01 | `md5` becomes required on [create
    upload](#tag/uploads/operation/createUpload). Single-part uploads that omit it
    will be rejected. |\n"
  contact:
    name: Nexus Mods
    url: https://nexusmods.com
  x-logo:
    url: https://api-docs.nexusmods.com/logo-light.png
    altText: Nexus Mods
tags:
  - name: collections
    description: Collection management
  - name: mod-files
    description: Mod file management
  - name: mods
    description: Mod management
  - name: uploads
    description: Upload management
servers:
  - url: https://api.nexusmods.com/v3
    description: Production server
security:
  - ApiKeyAuth: []
  - BearerJwtAuth: []
paths:
  "/collections/{id}":
    patch:
      tags:
        - collections
      summary: Edit collection
      description: "Update the core details of a collection such as the name, summary,
        description, and category.

        "
      operationId: editCollection
      parameters:
        - name: id
          in: path
          required: true
          description: The unique identifier for the collection.
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/EditCollectionRequest"
      responses:
        "204":
          description: Successfully updated the collection.
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/ProblemDetails"
        "403":
          description: Forbidden
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/ProblemDetails"
        "404":
          description: The collection was not found.
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/ProblemDetails"
        "422":
          description: The request body failed validation.
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/ProblemDetails"
  "/games/{game_domain}/trending-mods":
    get:
      tags:
        - mods
      x-badges:
        - name: Experimental
          color: orange
      summary: Get trending mods for a game
      description:
        "Public feed of the top 5 trending mods for a game over the past\n`game.hot_mods_days`
        days, ranked by total endorsements. \nExcludes adult and unpublished mods.\n"
      operationId: getTrendingMods
      security: []
      parameters:
        - name: game_domain
          in: path
          required: true
          description: "Game domain name (e.g. `skyrimspecialedition`).

            "
          schema:
            type: string
      responses:
        "200":
          description: Top trending mods.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    "$ref": "#/components/schemas/TrendingModsResponse"
        "404":
          description: Game not found.
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/ProblemDetails"
  "/games/{game_domain}/dlcs":
    get:
      tags:
        - mods
      x-badges:
        - name: Experimental
          color: orange
      summary: Get available DLCs for a game
      description: List of DLCs available for a game.
      operationId: getGameDlcs
      security: []
      parameters:
        - name: game_domain
          in: path
          required: true
          description: "Game domain name (e.g. `skyrimspecialedition`).

            "
          schema:
            type: string
      responses:
        "200":
          description: DLCs available for the game.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    "$ref": "#/components/schemas/GameDlcsResponse"
        "404":
          description: Game not found.
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/ProblemDetails"
  "/games/{game_domain}/mods/{game_scoped_id}":
    get:
      tags:
        - mods
      x-badges:
        - name: Experimental
          color: orange
      summary: Get mod
      description: "Retrieve specified mod, from a specified game.

        "
      operationId: getMod
      parameters:
        - name: game_domain
          in: path
          required: true
          description: |
            Game domain name.

            This is the human readable game name which appears in URLs on the site e.g. `skyrimspecialedition` and `fallout4`.
          schema:
            type: string
        - name: game_scoped_id
          in: path
          required: true
          description: |
            The game-scoped identifier for the mod.

            This is the mod identifier which appears in URLs on the site e.g. `12604` from path `/skyrimspecialedition/mods/12604`.
          schema:
            type: string
      responses:
        "200":
          description: Mod details
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    "$ref": "#/components/schemas/GetModDetails"
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/ProblemDetails"
        "404":
          description: Not Found
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/ProblemDetails"
        "403":
          description: Forbidden
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/ProblemDetails"
  "/games/{game_domain}/mod-file-versions/{game_scoped_id}":
    get:
      tags:
        - mods
      summary: Get mod file version by game-scoped ID
      description: "Retrieve a specific mod file version for a game by its game-scoped
        identifier.

        "
