          schema:
            type: string
        - name: game_scoped_id
          in: path
          required: true
          description: "The game-scoped identifier for the mod file version.

            "
          schema:
            type: string
      responses:
        "200":
          description: The mod file version.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    "$ref": "#/components/schemas/ModFileVersion"
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/ProblemDetails"
        "404":
          description: Not Found
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/ProblemDetails"
        "403":
          description: Forbidden
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/ProblemDetails"
  "/mods/{id}/files":
    get:
      tags:
        - mods
      summary: Get mod files
