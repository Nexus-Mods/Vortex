  "/uploads":
    post:
      tags:
        - uploads
      x-badges:
        - name: md5 required from 2026-12-01
          color: orange
      summary: Create upload
      description: |
        Creates a new upload session. This allows you to upload the data for a new mod file version.

        ⚠️ Files larger than 100 MiB must use a [multi part upload](#tag/uploads/operation/createMultipartUpload).

        ### Next steps
        * Call `PUT` with your file data to the returned `presigned_url`. Recommended for files up to 100 MiB.
           * ⚠️ You must send a `Content-Disposition` header of `attachment; filename="<filename>"`, using the `filename`
             from your request. This value is part of the presigned URL signature, so the upload is rejected if the
             header is missing or does not match.
        * Once all data is uploaded, [finalise the upload](#tag/uploads/operation/finaliseUpload).

        ### Content integrity (`md5`)

        Supplying `md5` binds the presigned URL to that one file. The digest forms part of the URL
        signature, so the URL cannot be reused to upload different content, and storage rejects a body
        that does not match it.

        ⚠️ `md5` is **optional today and becomes required on or after 2026-12-01**. Send it now to
        avoid a breaking change later.

        * `md5` in your request body is the **hex** digest — the 32 characters `md5sum` prints, in
          upper or lower case.
        * Your `PUT` must also carry a `Content-MD5` header holding the **base64** encoding of the same
          digest (`openssl dgst -md5 -binary <file> | base64`). As with `Content-Disposition`, this value
          is part of the signature, so the upload is rejected if it is missing or does not match.
        * Retrying the same bytes to the same URL still succeeds, so this does not affect resumed or
          repeated uploads.
      operationId: createUpload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CreateSinglePartUploadRequest"
      responses:
        "201":
          description: Upload ID and presigned URL
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    "$ref": "#/components/schemas/CreateUploadSuccess"
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/ProblemDetails"
        "403":
          description: Forbidden
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/ProblemDetails"
        "422":
          description: Unprocessable Entity
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/ProblemDetails"
  "/uploads/multipart":
    post:
      tags:
        - uploads
      summary: Create multipart upload
      description: "Creates a new multipart upload session. This allows you to upload
        the data for a new mod file version.\n\n\U0001F4A1 Files smaller than 100
        MiB can use the simpler [single part upload](#tag/uploads/operation/createUpload).\n\n###
        Next steps\nMultipart upload uses the [Amazon S3 multipart upload specification](https://docs.aws.amazon.com/AmazonS3/latest/userguide/mpuoverview.html).\n\n*
        Call `PUT` with your file data to each `part_presigned_urls`.\n   * Each part
        must be `part_size_bytes` bytes, apart from the final part which may be smaller.\n
        \  * Retrieve the `ETag` response header value from each part upload.\n* Once
        all parts are uploaded, call `POST` to the `complete presigned_url` with [XML
        post data](#multipart-resources) describing\n  the `ETag` for each part.\n*
        Once multipart complete is called, [finalise the upload](#tag/uploads/operation/finaliseUpload).\n\n###
        Multipart resources\n\nSample XML for completing the multipart upload:\n\n```xml\n<CompleteMultipartUpload>
        \                                                                                                                                                                                                         \n
        \ <Part>                                                                                                                                                                                                                                                                           \n
        \   <PartNumber>1</PartNumber>                                                                                                                                                                                                                                                     \n
        \   <ETag>a54357aff0632cce46d942af68356b38</ETag>                                                                                                                                                                                                                                \n
        \ </Part>                                                                                                                                                                                                                                                                          \n
        \ <Part>                                                                                                                                                                                                                                                                           \n
        \   <PartNumber>2</PartNumber>                                                                                                                                                                                                                                                     \n
        \   <ETag>0c78aef83f66abc1fa1e8477f296d394</ETag>                                                                                                                                                                                                                                \n
        \ </Part>                                                                                                                                                                                                                                                                          \n
        \ <Part>                                                                                                                                                                                                                                                                           \n
        \   <PartNumber>3</PartNumber>                                                                                                                                                                                                                                                     \n
        \   <ETag>acbd18db4cc2f85cedef654fccc4a4d8</ETag>                                                                                                                                                                                                                                \n
        \ </Part>                                                                                                                                                                                                                                                                          \n</CompleteMultipartUpload>\n```\n"
      operationId: createMultipartUpload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CreateUploadRequest"
      responses:
        "201":
          description: Upload ID and presigned URL
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    "$ref": "#/components/schemas/CreateMultipartUploadSuccess"
        "403":
          description: Forbidden
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/ProblemDetails"
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/ProblemDetails"
        "422":
          description: Unprocessable Content
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/ProblemDetails"
