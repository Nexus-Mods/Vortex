          type: integer
          description: The revision number.
        revision_status:
          "$ref": "#/components/schemas/RevisionStatus"
    CollectionPayload:
      type: object
      description: The data payload used to create a collection revision.
      required:
        - adult_content
        - collection_manifest
        - collection_schema_id
      properties:
        adult_content:
          type: boolean
          description: Whether the collection includes adult content.
        collection_manifest:
          "$ref": "#/components/schemas/CollectionManifest"
        collection_schema_id:
          type: integer
          description: Collection schema id.
    CollectionManifest:
      type: object
      description: The JSON manifest that defines a collection.
      required:
        - info
        - mods
      properties:
        info:
          "$ref": "#/components/schemas/CollectionManifestInfo"
        mods:
          type: array
          items:
            "$ref": "#/components/schemas/CollectionManifestMod"
          description: List of mod resources for the manifest.
    CollectionManifestInfo:
      type: object
      description: The info section of the JSON manifest.
      required:
        - author
        - name
        - domain_name
      properties:
        author:
          type: string
          description: The collection author's name.
        author_url:
          type: string
          nullable: true
          description: The url of the author's profile.
        name:
          type: string
          description: The name of the collection.
          minLength: 3
          maxLength: 36
        description:
          type: string
          nullable: true
          description: A description of the collection.
        summary:
          type: string
          nullable: true
          description: A short summary of the collection.
          maxLength: 255
        domain_name:
          type: string
          description: The domain name of the game.
        game_versions:
          type: array
          nullable: true
          items:
            type: string
          description: A list of game versions that this revision has been tested
            with.
    CollectionManifestMod:
      type: object
      description: Defines a mod to be used in a collection as part of the manifest.
      required:
        - name
        - version
        - optional
        - domain_name
        - source
      properties:
        name:
          type: string
          description: The name of the mod.
        version:
          type: string
          description: The mod version.
        optional:
          type: boolean
          description: Whether the mod is required for this collection.
        domain_name:
          type: string
          description: The domain name of the game for the mod.
        source:
          "$ref": "#/components/schemas/CollectionManifestModSource"
        author:
          type: string
          nullable: true
          description: The name of the mod author.
    CollectionManifestModSource:
      type: object
      description: Source information for a mod (nexus or other) as part of the manifest.
      required:
        - type
      properties:
        type:
          "$ref": "#/components/schemas/ModSource"
        mod_id:
          type: string
          description: The identifier of the mod source for this collection manifest.
        file_id:
          type: string
          description: The identifier of the mod file version associated with the
            mod in this collection manifest.
        md5:
          type: string
          nullable: true
          description: An MD5 hash of the file for verification.
        file_size:
          type: integer
          nullable: true
          description: The file size in kb.
        update_policy:
          "$ref": "#/components/schemas/UpdatePolicy"
        logical_filename:
          type: string
          nullable: true
          description: Logical file name of the mod resource.
        file_expression:
          type: string
          nullable: true
          description: File expression of the mod resource.
        url:
          type: string
          nullable: true
          description: The direct url of the file.
        adult_content:
          type: boolean
          nullable: true
          description: Does the mod include adult content.
    ModSource:
      type: string
      description: Used to define the source of a mod. Useful for informing Collections
        how to retrieve mods.
      enum:
        - nexus
        - direct
        - browse
        - manual
        - bundle
    RevisionStatus:
      type: string
      description: The status of a collection revision.
      enum:
        - draft
        - published
        - retracted
    UpdatePolicy:
      type: string
      description: Available update policies of a file resource
      enum:
        - exact
        - latest
        - prefer
    VortexData:
      type: object
      required:
        - extensions
        - themes
        - translations
      properties:
        extensions:
          type: array
          description: |
            Vortex extensions, classified as `game` or `other`. Filtered by
            `game_ids` when provided.
          items:
            "$ref": "#/components/schemas/VortexExtension"
        themes:
          type: array
          description: All Vortex themes.
          items:
            "$ref": "#/components/schemas/VortexAsset"
        translations:
          type: array
          description: All Vortex translations.
          items:
            "$ref": "#/components/schemas/VortexTranslation"
    VortexAsset:
      type: object
      description: |
        Common Vortex asset data, forwarded from the mod page. Uniqueness is
        `mod_id` + `file_id` (one mod per extension, one file per version).
      required:
        - name
        - version
        - author_name
        - author_user_id
        - uploaded_at
        - mod_id
        - file_id
        - image_url
      properties:
        name:
          type: string
          description: The mod name.
          example: Example Vortex Extension
        version:
          type: string
          description: The file version string.
          example: 1.2.0
        author_name:
          type: string
          description: Username of the uploader.
          example: ExampleAuthor
        author_user_id:
          type: string
          description: Nexus Mods user ID of the uploader.
          example: "54321"
        uploaded_at:
          type: string
          format: date-time
          description: ISO 8601 timestamp of when the file was uploaded.
          example: "2023-11-14T22:13:20Z"
        mod_id:
          type: string
          description: The Nexus Mods mod ID.
          example: "12345"
        file_id:
          type: string
          description: The Nexus Mods file ID.
          example: "99999"
        image_url:
          type: string
          nullable: true
          description: |
            URL of the image: the mod page image, or the game artwork for
            game extensions. Null if unavailable.
          example: https://staticdelivery.nexusmods.com/mods/1/images/12345-0-1700000000.jpg
    VortexExtension:
      description: |
        A Vortex extension, classified from its code (`info.json`). A `game`
        extension targets a specific game and carries a `game_id`; all others
        are `other`.
      allOf:
        - "$ref": "#/components/schemas/VortexAsset"
        - type: object
          required:
            - type
          properties:
            type:
              type: string
              enum:
                - game
                - other
              description: |
                `game` if code analysis determined the extension targets a specific
                game (see `game_id`); otherwise `other`.
              example: game
            game_id:
              type: string
              nullable: true
              description: |
                The Nexus Mods game ID, determined by code analysis. Present only
                when `type` is `game`.
              example: "1"
    VortexTranslation:
      description: "A Vortex translation, with the language it translates into.

        "
      allOf:
        - "$ref": "#/components/schemas/VortexAsset"
        - type: object
          required:
            - locale
          properties:
            locale:
              type: string
              nullable: true
              description: |
                BCP 47 language tag the translation's strings are in (e.g. `pt-BR`).
                Null when a locale could not be determined for it.
              example: pt-BR
