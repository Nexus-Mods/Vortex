name: Linear Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to sync (e.g. 'v2.6.0-beta.1'). Channel is inferred: tags with a '-' are pre-releases."
        required: true
        type: string
      dry-run:
        description: "Dry run? (scan commits and log actions without modifying Linear)"
        type: boolean
        default: true

concurrency:
  group: linear-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    name: Sync issues to Linear release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # the Linear CLI scans <base>..HEAD, so it needs HEAD at the tag
      - name: Check out tag in a worktree
        id: tag-tree
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          TREE: ${{ runner.temp }}/release-tag
        run: |
          git worktree add --detach "$TREE" "refs/tags/$TAG"
          echo "git-dir=$(git -C "$TREE" rev-parse --absolute-git-dir)" >> "$GITHUB_OUTPUT"
          echo "work-tree=$TREE" >> "$GITHUB_OUTPUT"

      - name: Prepare release range
        id: prepare
        uses: ./.github/actions/linear-release
        with:
          mode: prepare
          tag: ${{ github.event.release.tag_name || inputs.tag }}
          # release event carries the flag; on dispatch a '-' in the tag means pre-release
          prerelease: ${{ github.event_name == 'release' && github.event.release.prerelease || contains(inputs.tag, '-') }}

      - name: Sync issues to release
        id: sync
        uses: linear/linear-release-action@v0
        # the action has no working-directory input; its CLI shells out to git, which follows these
        env:
          GIT_DIR: ${{ steps.tag-tree.outputs.git-dir }}
          GIT_WORK_TREE: ${{ steps.tag-tree.outputs.work-tree }}
        with:
          access_key: ${{ secrets.LINEAR_ACCESS_KEY }}
          command: sync
          name: ${{ steps.prepare.outputs.tag }}
          version: ${{ steps.prepare.outputs.tag }}
          base_ref: ${{ steps.prepare.outputs.base }}
          release_notes: ${{ steps.prepare.outputs.notes-file }}
          dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
          log_level: verbose

      - name: Mark release as released
        id: complete
        uses: linear/linear-release-action@v0
        env:
          GIT_DIR: ${{ steps.tag-tree.outputs.git-dir }}
          GIT_WORK_TREE: ${{ steps.tag-tree.outputs.work-tree }}
        with:
          access_key: ${{ secrets.LINEAR_ACCESS_KEY }}
          command: complete
          version: ${{ steps.prepare.outputs.tag }}
          dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
          log_level: verbose

      - name: Write run summary
        if: ${{ always() && steps.prepare.outcome == 'success' }}
        uses: ./.github/actions/linear-release
        with:
          mode: summary
          tag: ${{ steps.prepare.outputs.tag }}
          prevtag: ${{ steps.prepare.outputs.prevtag }}
          base: ${{ steps.prepare.outputs.base }}
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
          sync-outcome: ${{ steps.sync.outcome }}
          complete-outcome: ${{ steps.complete.outcome }}
          notes-file: ${{ steps.prepare.outputs.notes-file }}
          release-url: ${{ steps.sync.outputs.release-url }}
