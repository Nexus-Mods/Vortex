name: Linear Release

on:
  release:
    types: [prereleased, released]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to sync (e.g. 'v2.6.0-beta.1'). Channel is inferred: tags with a '-' are pre-releases."
        required: true
        type: string
      dry-run:
        description: "Dry run? (scan commits and log actions without modifying Linear)"
        type: boolean
        default: true

concurrency:
  group: linear-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    name: Sync issues to Linear release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0

      - name: Resolve release tag and channel
        id: release
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          PRERELEASE: ${{ github.event_name == 'release' && github.event.release.prerelease || contains(inputs.tag, '-') }}
        run: |
          if ! git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
            echo "::error::Tag '$TAG' not found"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Determine previous release tag
        id: prev
        env:
          TAG: ${{ steps.release.outputs.tag }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          # The scan base derives from the previous tag on the same channel:
          # pre-releases compare against the previous pre-release, stables
          # against the previous stable. The CLI requires base_ref to be an
          # ancestor of HEAD, and the previous tag usually sits on a diverged
          # release/vX.Y branch, so we pass the merge-base (fork point)
          # instead — the resulting range is exactly the commits new to this
          # release.
          if [ "$PRERELEASE" = "true" ]; then
            pattern='^v[0-9]+\.[0-9]+\.[0-9]+-'
          else
            pattern='^v[0-9]+\.[0-9]+\.[0-9]+$'
          fi
          prev=$(git tag --list 'v*' | grep -E "$pattern" | grep -vFx "$TAG" \
            | { cat; echo "$TAG"; } | sort -uV \
            | awk -v cur="$TAG" '$0 == cur { print p; exit } { p = $0 }')
          base=""
          if [ -n "$prev" ]; then
            base=$(git merge-base "refs/tags/$prev" "refs/tags/$TAG")
            echo "Previous $([ "$PRERELEASE" = "true" ] && echo pre-release || echo release): $prev; scanning $base..$TAG"
          else
            echo "No previous tag found; the release CLI will use its default scan base"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "prevtag=$prev" >> "$GITHUB_OUTPUT"

      - name: Sync issues to release
        id: sync
        uses: linear/linear-release-action@v0
        with:
          access_key: ${{ secrets.LINEAR_ACCESS_KEY }}
          command: sync
          version: ${{ steps.release.outputs.tag }}
          base_ref: ${{ steps.prev.outputs.base }}
          dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
          log_level: verbose

      - name: Mark release as released
        id: complete
        uses: linear/linear-release-action@v0
        with:
          access_key: ${{ secrets.LINEAR_ACCESS_KEY }}
          command: complete
          version: ${{ steps.release.outputs.tag }}
          dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
          log_level: verbose

      - name: Write run summary
        if: ${{ always() && steps.prev.outcome == 'success' }}
        env:
          TAG: ${{ steps.release.outputs.tag }}
          PREV: ${{ steps.prev.outputs.prevtag }}
          BASE: ${{ steps.prev.outputs.base }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
          SYNC_OUTCOME: ${{ steps.sync.outcome }}
          COMPLETE_OUTCOME: ${{ steps.complete.outcome }}
          RELEASE_URL: ${{ steps.sync.outputs.release-url }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          # Human-readable recap on the run's summary page. The issue keys
          # mirror the CLI's client-side commit scan; Linear resolves PR
          # links server-side on top of these, so the release page in Linear
          # is the authoritative list.
          {
            if [ "$DRY_RUN" = "true" ]; then
              echo "## Linear Release — \`$TAG\` (dry run, Linear was not modified)"
            else
              echo "## Linear Release — \`$TAG\`"
            fi
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Previous tag (same channel) | ${PREV:-_none_} |"
            echo "| Scan base (fork point) | ${BASE:-_CLI default_} |"
            echo "| Sync issues | $SYNC_OUTCOME |"
            echo "| Mark released | $COMPLETE_OUTCOME |"
            if [ -n "$RELEASE_URL" ]; then
              echo "| Linear release | $RELEASE_URL |"
            fi
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$BASE" ]; then
            exit 0
          fi
          range="$BASE..refs/tags/$TAG"
          keys=$(git log "$range" --format='%s' \
            | grep -ioE '\b[a-z]{2,}-[0-9]+\b' | tr 'a-z' 'A-Z' \
            | grep -v '^PR-' | sort -uV)
          {
            echo "### Issue keys detected in commits ($(printf '%s' "$keys" | grep -c . || true))"
            echo
            for key in $keys; do
              printf '[%s](https://linear.app/nexus-mods/issue/%s) ' "$key" "$key"
            done
            echo
            echo
            echo "_Candidates from the branch/subject scan — some are branch-name artifacts whose links lead nowhere. Linear ignores keys that don't exist and also attaches issues linked to the pull requests below; the release page in Linear is the authoritative list._"
            echo
            echo "### Pull requests in range"
            echo
            git log "$range" --merges --format='%H' | while read -r sha; do
              subject=$(git show -s --format='%s' "$sha")
              num=$(printf '%s' "$subject" | sed -nE 's/^Merge pull request #([0-9]+).*/\1/p')
              if [ -z "$num" ]; then
                continue
              fi
              title=$(git show -s --format='%b' "$sha" | sed -n 1p)
              echo "- [#$num]($REPO_URL/pull/$num) ${title:-$subject}"
            done
          } >> "$GITHUB_STEP_SUMMARY"
