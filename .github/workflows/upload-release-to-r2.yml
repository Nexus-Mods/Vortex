name: Publish to WinGet

# Experiment: close the winget-pkgs PR opened by the previous test run and
# delete its branch on the fork. Uses PERSONAL_ACCESS_TOKEN because only the
# PR author can close a PR on microsoft/winget-pkgs.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v2.6.2)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  close:
    name: Close winget-pkgs PR
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
      PR: 425304
      FORK_BRANCH: NexusMods.Vortex-2.6.2-91B10DEA202E4B9D86857DEB8DD750FB
    steps:
      - name: Close PR
        run: gh pr close "$PR" -R microsoft/winget-pkgs --comment "Closing - this was opened by a test run of our release automation. Will be resubmitted."

      - name: Delete branch on fork
        run: gh api -X DELETE "repos/Nexus-Mods/winget-pkgs/git/refs/heads/$FORK_BRANCH"
