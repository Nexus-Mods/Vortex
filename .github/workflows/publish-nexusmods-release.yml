name: Publish Release to Nexus Mods

on:
  # Runs when a GitHub release (not pre-release) is undrafted.
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. 'v2.4.0')."
        required: true
        type: string
      dry-run:
        description: "Dry run? (validate release and changelog without uploading)"
        type: boolean
        default: true
      file-id:
        description: "Nexus file ID to upload to. Overrides NEXUS_VORTEX_FILE_ID. Requires mod-id."
        type: string
      mod-id:
        description: "Nexus mod ID the changelog is attached to. Overrides NEXUS_VORTEX_MOD_ID. Requires file-id."
        type: string

concurrency:
  group: publish-nexus
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      FILE_ID_OVERRIDE: ${{ inputs.file-id }}
      MOD_ID_OVERRIDE: ${{ inputs.mod-id }}
      FILE_ID: ${{ inputs.file-id || vars.NEXUS_VORTEX_FILE_ID }}
      MOD_ID: ${{ inputs.mod-id || vars.NEXUS_VORTEX_MOD_ID }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate Nexus identifiers
        run: |
          if [ -z "$FILE_ID" ]; then
            echo "::error::No Nexus file ID. Set the NEXUS_VORTEX_FILE_ID repository variable."
            exit 1
          fi
          if [ -z "$MOD_ID" ]; then
            echo "::error::No Nexus mod ID. Set the NEXUS_VORTEX_MOD_ID repository variable."
            exit 1
          fi
          # A half-applied override would upload the file to one mod page and
          # attach the changelog to another.
          if { [ -n "$FILE_ID_OVERRIDE" ] && [ -z "$MOD_ID_OVERRIDE" ]; } ||
             { [ -z "$FILE_ID_OVERRIDE" ] && [ -n "$MOD_ID_OVERRIDE" ]; }; then
            echo "::error::Override file-id and mod-id together, or neither - they must address the same mod page."
            exit 1
          fi
          echo "Uploading to file $FILE_ID on mod $MOD_ID."

      - name: Prepare Nexus Mods release
        id: prepare
        uses: ./.github/actions/prepare-nexusmods-release
        with:
          tag: ${{ github.event.release.tag_name || inputs.tag }}
          dry-run: ${{ inputs.dry-run || false }}

      - name: Upload to Nexus Mods
        if: ${{ !inputs.dry-run }}
        uses: Nexus-Mods/upload-action@v1.0.0-beta.10
        with:
          api_key: ${{ secrets.NEXUS_API_KEY }}
          file_id: ${{ env.FILE_ID }}
          mod_id: ${{ env.MOD_ID }}
          filename: ${{ steps.prepare.outputs.installer-path }}
          version: ${{ steps.prepare.outputs.version }}
          display_name: Vortex ${{ steps.prepare.outputs.version }}
          description: This will download the latest installer for Vortex
          changelog: ${{ steps.prepare.outputs.changelog }}
          category: main
          archive_existing_version: true
          update_mod_version: true
