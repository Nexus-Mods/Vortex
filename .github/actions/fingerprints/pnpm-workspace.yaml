# Declares this directory as its own pnpm workspace root so `pnpm install`
# stops walking up to the repo-root workspace. The action ships its own
# bundled dist/index.js and is not part of the Vortex workspace.
packages:
  - .
allowBuilds:
  esbuild: true

# ncc hashes dependency paths into module ids, so this cap cannot vary by platform (pnpm defaults to 60 on Windows, 120 elsewhere).
virtualStoreDirMaxLength: 60
