name: Update resolved fingerprints
description: >-
  Collect fingerprints (from a PR body, a published release, or manual inputs) and
  write to vortex.resolved_fingerprints in ClickHouse.

inputs:
  mode:
    description: "pr | release | resolve"
    required: true
  fingerprints:
    description: "mode=resolve: comma- or whitespace-separated list of 8-hex-char fingerprints."
    required: false
    default: ""
  remove:
    description: "mode=resolve: remove from the table instead of adding (true/false)."
    required: false
    default: "false"
  status:
    description: "mode=resolve: fixed | released | ignored. Used when adding."
    required: false
    default: fixed
  release-version:
    description: "mode=resolve: required when status=released and remove=false."
    required: false
    default: ""
  tag:
    description: "mode=release: release tag to scan when there is no `release` event payload (workflow_dispatch)."
    required: false
    default: ""
  prerelease:
    description: "mode=release: 'true' if `tag` is a pre-release. Ignored when the release payload is present."
    required: false
    default: "false"
  pr-number:
    description: "mode=pr: merged pull request to scan when there is no `pull_request` event payload (workflow_dispatch)."
    required: false
    default: ""
  dry-run:
    description: "Log the collected rows without writing them to ClickHouse."
    required: false
    default: "false"
  github-token:
    description: "GITHUB_TOKEN for API calls (mode=release, and mode=pr with pr-number)."
    required: false
    default: ${{ github.token }}
  clickhouse-url:
    description: ClickHouse HTTP endpoint.
    required: true
  clickhouse-user:
    description: ClickHouse username.
    required: true
  clickhouse-password:
    description: ClickHouse password.
    required: true

runs:
  using: node24
  main: dist/index.js
