name: Prepare release for Nexus Mods
description: >-
  Validate a stable Vortex GitHub release, download its installer, and build
  the plain-text changelog for the Nexus Mods Upload API from CHANGELOG.md.

inputs:
  tag:
    description: "Release tag to prepare (eg: 'v2.4.0')."
    required: true
  dry-run:
    description: "Validate the release and build the changelog without downloading the installer."
    required: false
    default: "false"
  changelog-path:
    description: "Path to CHANGELOG.md, relative to the workspace."
    required: false
    default: CHANGELOG.md
  download-dir:
    description: "Directory the installer is downloaded into."
    required: false
    default: ./release-assets
  github-token:
    description: "Token used for the `gh` release queries and the asset download."
    required: false
    default: ${{ github.token }}

outputs:
  tag:
    description: "Git tag of the prepared release (eg: 'v2.4.0')."
  version:
    description: "Version without a leading 'v' (eg: '2.4.0')."
  installer-name:
    description: "File name of the installer asset."
  installer-path:
    description: "Local path to the downloaded installer."
  body:
    description: "Markdown body of the GitHub release."
  changelog:
    description: "Plain-text changelog aggregated from CHANGELOG.md."

runs:
  using: node24
  main: dist/index.js
